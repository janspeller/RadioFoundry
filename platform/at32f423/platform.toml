# The AT32F423 platform's registry entry (tools/boards.py): what the tools and CI need to know about every board on it.
# The build itself reads platform.mk, never this file.

id = "at32f423"
isa = "arm"
# The SoC every board on the platform has (a board's [hardware] cpu overrides it for the site's table)
cpu = "AT32F423"
# No flash stub yet: the boards are installed through their vendor bootloader
stubs = []
# Linker symbols every board's scripts must define: none (no codec in program flash)
codec_symbols = []
# Program flash starts here. A vendor bootloader holds the flash from here to a board's image, which is never written
flash_base = 0x08000000
# The geometry a board's [flash] sectors names unless it says otherwise
default_sectors = "at32f423_256k"

# The toolchain CI and releases build with: the same Arm toolchain as the STM32F4 platform (one CI job builds both;
# platform/stm32f4/platform.toml)
[toolchain]
id = "arm"
name = "Arm"
cc = "arm-none-eabi-gcc"
build = "tools/install-arm-toolchain.sh"
version = "13.3.rel1"
sha256 = "95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4"

# Flash geometries: [index, address, size]. AT32F423 with 256 KB: 128 sectors of 2 KB (RM V2.04 5.1). A board's
# sectors are those from its image up; the ones below hold its bootloader
[sectors]
